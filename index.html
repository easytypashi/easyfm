    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.65);
            --bg-glow: rgba(180, 220, 255, 0.12);
            --border-glow: rgba(255, 255, 255, 0.4);
            --glitch-x: 0;
            --glitch-y: 0;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* CRT Vignette ve Karartma */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 15%, #000000 120%);
            z-index: 45;
            pointer-events: none;
        }

        /* CRT Noise & Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.45;
        }

        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.03) 50%, transparent 100%);
            z-index: 46;
            pointer-events: none;
            animation: scanlineAnim 8s linear infinite;
        }

        @keyframes scanlineAnim {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .trap-bg-text {
            position: fixed;
            font-family: 'UnifrakturCook', cursive;
            color: rgba(255, 255, 255, 0.035);
            font-size: 24vw;
            z-index: 1;
            pointer-events: none;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -4px;
            text-shadow: 0 0 45px var(--glow-color);
            filter: blur(1.5px);
            transition: color 0.3s ease, transform 0.1s ease-out;
            will-change: transform;
        }

        .trap-bg-text.top-left { top: -8%; left: -15%; transform: rotate(-12deg); }
        .trap-bg-text.bottom-right { bottom: -12%; right: -15%; transform: rotate(10deg); }

        .spray-tag {
            position: fixed;
            font-family: 'Permanent Marker', cursive;
            color: var(--accent-color);
            opacity: 0.15;
            font-size: 11vw;
            z-index: 1;
            pointer-events: none;
            transition: color 0.4s ease, opacity 0.4s ease, transform 0.1s ease-out;
            text-shadow: 0 0 25px var(--glow-color);
            will-change: transform;
        }

        .spray-tag.tag1 { top: 32%; left: 1%; transform: rotate(-22deg); }
        .spray-tag.tag2 { top: 18%; right: 2%; transform: rotate(18deg); }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        #lightning-flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--accent-color);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: overlay;
            will-change: opacity;
        }

        .ambient-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 45%, rgba(0, 0, 0, 0) 75%);
            z-index: 4;
            pointer-events: none;
            transition: transform 0.05s ease-out, opacity 0.05s ease-out, background 0.4s ease;
            will-change: transform, opacity;
            filter: blur(80px);
        }

        #mobile-glitch-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 40; pointer-events: none; opacity: 0;
            mix-blend-mode: exclusion;
            background: transparent;
            will-change: opacity, transform;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
            gap: 10px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .wrapper-shake {
            animation: trapBassShake 0.06s ease-in-out infinite alternate;
        }

        .wrapper-glitch {
            filter: drop-shadow(-8px 0 0px rgba(255, 0, 50, 0.95)) drop-shadow(8px 0 0px rgba(0, 240, 255, 0.95)) !important;
            transform: translate(calc(var(--glitch-x) * 1px), calc(var(--glitch-y) * 1px)) scale(1.025) !important;
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.01) translate(-2px, 2px); }
            100% { transform: scale(0.99) translate(2px, -2px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            height: clamp(190px, 33vh, 320px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
            cursor: grab;
        }

        .logo-container:active {
            cursor: grabbing;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 640px;
                height: clamp(270px, 39vh, 400px);
            }
        }

        #globe-3d-container {

        .theme-purple { background: #a855f7; box-shadow: 0 0 14px #a855f7; }

            background: rgba(255, 255, 255, 0.2); outline: none; cursor: pointer;

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent-color); box-shadow: 0 0 12px var(--accent-color);

        .video-container {
            position: relative;
            width: 100%; flex: 1 1 auto;
            min-height: 140px; max-height: 38vh;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.98);

        .video-container.playing-border {

        #youtube-player {

        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {

            background: radial-gradient(circle, rgba(10, 10, 10, 0.97) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color); color: #000;
            font-family: 'Syne', sans-serif; font-weight: 900; font-size: 11px;
            padding: 18px 46px; border: none; border-radius: 50px;
            cursor: pointer; letter-spacing: 4px;
            box-shadow: 0 0 50px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase; position: relative; overflow: hidden;
        }

        .start-btn::after {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: rotate(30deg); animation: btnShine 2.5s infinite;
        }

        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .start-btn:hover {
            transform: scale(1.08); box-shadow: 0 0 70px var(--accent-color);
        }

        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.90);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 18px; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0; position: relative; overflow: hidden; margin-bottom: 4px;
        }

        .track-info {
            display: flex; flex-direction: column; gap: 3px;
            overflow: hidden; max-width: 58%;
        }

        .track-label {
            font-size: 8px; font-weight: 900; letter-spacing: 2px;
            color: #888; text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 900;
            color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6); letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px; color: #aaa; text-align: right;

        .wave-bars {

        .wave-bar {

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }

    </style>

                i = Math.floor(pseudoRandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const songList = getDeterministicShuffledList(baseSongList, STREAM_START_TIME);
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return { songIndex: i, seekTo: elapsedTime - accumulatedTime };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function updateTrackLabels(currentIndex) {
            const currentSong = songList[currentIndex];
            const nextIndex = (currentIndex + 1) % songList.length;
            const nextSong = songList[nextIndex];

            document.getElementById('current-track-name').innerText = currentSong.title;
            document.getElementById('next-track-name').innerText = nextSong.title;
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.songIndex);

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];
            currentLoadedVideoId = targetSong.id;

            player = new YT.Player('youtube-player', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'start': Math.floor(state.seekTo),
                    'mute': 1
                },
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        if (player && typeof player.playVideo === 'function') player.playVideo();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        const mainWrapper = document.getElementById('main-wrapper');

        function updateAudioVisualState() {
            const vBox = document.getElementById('video-box');
            const waveBars = document.getElementById('wave-bars');
            const vol = Number(volumeRange.value);

            if (!userHasClicked || vol === 0 || isMuted || !actualPlayerStatePlaying) {
                isPlayingState = false;
                vBox.classList.remove('playing-border');
                waveBars.style.opacity = '0';
                mainWrapper.classList.remove('wrapper-shake');
            } else {
                isPlayingState = true;
                vBox.classList.add('playing-border');
                waveBars.style.opacity = '1';
                mainWrapper.classList.add('wrapper-shake');
            }
        }

        function onPlayerStateChange(event) {
            actualPlayerStatePlaying = (event.data === YT.PlayerState.PLAYING);
            updateAudioVisualState();
        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player || !userHasClicked) return;
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({ videoId: targetSong.id, startSeconds: Math.floor(state.seekTo) });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                if (timeDiff > 1.8) {
                    player.seekTo(state.seekTo, true);
                    if (typeof player.getPlayerState === 'function' && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    }
                }
            }
        }

        function handleUserClick(e) {
            if (e && e.cancelable) e.preventDefault();
            if (userHasClicked) return;
            userHasClicked = true;

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0'; overlay.style.pointerEvents = 'none';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);

            const startPlaying = () => {
                const state = getCurrentStreamState();
                const targetSong = songList[state.songIndex];

                updateTrackLabels(state.songIndex);
                if (typeof player.unMute === 'function') player.unMute();
                if (typeof player.setVolume === 'function') player.setVolume(Number(volumeRange.value));

                if (currentLoadedVideoId !== targetSong.id) {
                    currentLoadedVideoId = targetSong.id;
                    player.loadVideoById({ videoId: targetSong.id, startSeconds: Math.floor(state.seekTo) });
                } else {
                    player.seekTo(state.seekTo, true);
                }

                player.playVideo();
                updateAudioVisualState();

                if (syncCheckInterval) clearInterval(syncCheckInterval);
                syncCheckInterval = setInterval(syncToLiveStream, 1000);
            };

            if (isPlayerReady && player) {
                startPlaying();
            } else {
                const checkReady = setInterval(() => {
                    if (isPlayerReady && player) {
                        clearInterval(checkReady);
                        startPlaying();
                    }
                }, 50);
            }
        }

        const startOverlay = document.getElementById('start-overlay');
        const startBtnEl = document.getElementById('start-btn-el');

        startOverlay.addEventListener('click', handleUserClick);
        startOverlay.addEventListener('touchstart', handleUserClick);
        startBtnEl.addEventListener('click', handleUserClick);
        startBtnEl.addEventListener('touchstart', handleUserClick);

        const volumeRange = document.getElementById('volume-range');
        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;
        let lastVolume = 100;

        volumeRange.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(val);
                if (val === 0) {
                    player.mute(); muteBtn.innerText = '🔇'; isMuted = true;
                } else {
                    if (isMuted || (typeof player.isMuted === 'function' && player.isMuted())) {
                        player.unMute(); isMuted = false;
                    }
                    muteBtn.innerText = '🔊'; lastVolume = val;
                }
            }
            updateAudioVisualState();
        });

        muteBtn.addEventListener('click', () => {
            if (!player) return;
            if (isMuted) {
                player.unMute(); muteBtn.innerText = '🔊';
                let currentVol = Number(volumeRange.value);
                if (currentVol === 0) { currentVol = lastVolume > 0 ? lastVolume : 100; volumeRange.value = currentVol; }
                if (typeof player.setVolume === 'function') player.setVolume(currentVol);
                isMuted = false;
            } else {
                player.mute(); muteBtn.innerText = '🔇';
                if (Number(volumeRange.value) > 0) lastVolume = Number(volumeRange.value);
                volumeRange.value = 0; isMuted = true;
            }
            updateAudioVisualState();
        });

        /* THREE.JS 3D SCENE & INTERACTIVE GLOBE */
        const globeContainer = document.getElementById('globe-3d-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        globeContainer.appendChild(renderer.domElement);

        function resizeThreeJS() {
            const width = globeContainer.clientWidth;
            const height = globeContainer.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;
            camera.position.z = window.innerWidth > 768 ? 5.2 : (window.innerHeight <= 650 ? 5.8 : 5.5);
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

        const baseRadius = 1.35;
        const geometry = new THREE.SphereGeometry(baseRadius, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture, roughness: 0.35, metalness: 0.55
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        /* Interactive Mouse Drag Rotation for Globe */
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const logoTouchArea = document.getElementById('logo-touch-area');

        logoTouchArea.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
            globeMesh.rotation.y += deltaMove.x * 0.008;
            globeMesh.rotation.x += deltaMove.y * 0.008;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        const ringBarsCount = 80; 
        const ringBarsGroup = new THREE.Group();
        const ringBarMeshes = [];
        const barHeight = 0.45;

        for (let i = 0; i < ringBarsCount; i++) {
            const barGeo = new THREE.BoxGeometry(0.035, barHeight, 0.035);
            barGeo.translate(0, barHeight / 2, 0); 
            const barMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            const bar = new THREE.Mesh(barGeo, barMat);
            
            const angle = (i / ringBarsCount) * Math.PI * 2;
            const radius = baseRadius + 0.01;
            bar.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
            bar.rotation.z = angle - Math.PI / 2;
            
            ringBarsGroup.add(bar);
            ringBarMeshes.push(bar);
        }
        scene.add(ringBarsGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3.2);
        dirLight.position.set(5, 4, 5);
        scene.add(dirLight);

        let ringMesh = null;
        function createOrbitRingText() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'transparent'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff';

            ctx.font = '900 70px "Montserrat", sans-serif';
            ctx.fillText("EA$Y FM", canvas.width / 2, 85);
            ctx.font = '800 28px "Space Grotesk", sans-serif';
            ctx.fillText("7/24 TRAP & OPIUM RADIO", canvas.width / 2, 165);

            const ringTex = new THREE.CanvasTexture(canvas);
            ringTex.minFilter = THREE.LinearFilter; ringTex.magFilter = THREE.LinearFilter;

            const ringGeo = new THREE.CylinderGeometry(baseRadius + 0.3, baseRadius + 0.3, 0.65, 64, 1, true);
            const ringMat = new THREE.MeshBasicMaterial({
                map: ringTex, transparent: true, side: THREE.DoubleSide, depthWrite: false
            });

            ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.z = 0.08;
            scene.add(ringMesh);
        }
        document.fonts.ready.then(() => { createOrbitRingText(); });

        let bassAngle = 0;
        const ambientGlowEl = document.getElementById('ambient-glow');
        const lightningEl = document.getElementById('lightning-flash');
        const mobileGlitchEl = document.getElementById('mobile-glitch-overlay');
        const badgeLiveEl = document.getElementById('badge-live');
        const badgeListenerEl = document.getElementById('badge-listener');
        const themeSelectorEl = document.getElementById('theme-selector-box');
        const volumeBoxEl = document.getElementById('volume-box');
        const videoBoxEl = document.getElementById('video-box');
        const tag1El = document.getElementById('tag1');
        const tag2El = document.getElementById('tag2');
        const bgText1El = document.getElementById('bg-text-1');
        const bgText2El = document.getElementById('bg-text-2');

        let lastTime = performance.now();

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);
            const deltaTime = (currentTime - lastTime) / 1000; 
            lastTime = currentTime;
            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            if (!isDragging) {
                const globeSpeed = isPlayingState ? 0.6 : 0.15;
                globeMesh.rotation.y += globeSpeed * deltaTime;
            }

            const ringSpeed = isPlayingState ? 0.75 : 0.22;
            if (ringMesh) ringMesh.rotation.y -= ringSpeed * deltaTime;
            ringBarsGroup.rotation.z += (isPlayingState ? 0.4 : 0.05) * deltaTime;

            if (isPlayingState) {
                bassAngle += 7.5 * deltaTime;
                const bassPower = Math.pow(Math.sin(bassAngle), 5);
                const bassScale = 1 + bassPower * 0.05; 
                
                globeMesh.scale.set(bassScale, bassScale, bassScale);
                dirLight.intensity = 2.5 + bassPower * 3.5;

                const glowScale = 1 + Math.sin(bassAngle) * 0.18;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(${glowScale})`;
                ambientGlowEl.style.opacity = (0.6 + bassPower * 0.4).toString();

                videoBoxEl.style.transform = `scale(${1 + bassPower * 0.015})`;

                if (tag1El && tag2El) {
                    tag1El.style.transform = `rotate(-22deg) scale(${1 + bassPower * 0.1})`;
                    tag2El.style.transform = `rotate(18deg) scale(${1 + bassPower * 0.1})`;
                    tag1El.style.opacity = (0.15 + bassPower * 0.25).toString();
                    tag2El.style.opacity = (0.15 + bassPower * 0.25).toString();
                }

                if (bgText1El && bgText2El) {
                    bgText1El.style.transform = `rotate(-12deg) scale(${1 + bassPower * 0.04})`;
                    bgText2El.style.transform = `rotate(10deg) scale(${1 + bassPower * 0.04})`;
                }

                if (bassPower > 0.6) {
                    badgeLiveEl.classList.add('badge-bass-pulse');
                    badgeListenerEl.classList.add('badge-bass-pulse');
                    themeSelectorEl.classList.add('badge-bass-pulse');
                    volumeBoxEl.classList.add('badge-bass-pulse');
                } else {
                    badgeLiveEl.classList.remove('badge-bass-pulse');
                    badgeListenerEl.classList.remove('badge-bass-pulse');
                    themeSelectorEl.classList.remove('badge-bass-pulse');
                    volumeBoxEl.classList.remove('badge-bass-pulse');
                }

                if (bassPower > 0.65) {
                    const shiftX = (Math.random() - 0.5) * 18;
                    const shiftY = (Math.random() - 0.5) * 10;
                    document.documentElement.style.setProperty('--glitch-x', shiftX);
                    document.documentElement.style.setProperty('--glitch-y', shiftY);
                    mainWrapper.classList.add('wrapper-glitch');

                    mobileGlitchEl.style.opacity = (0.25 + (bassPower - 0.65) * 1.6).toString();
                    mobileGlitchEl.style.background = Math.random() > 0.5 
                        ? 'linear-gradient(90deg, rgba(255,0,80,0.3) 0%, transparent 50%, rgba(0,255,255,0.3) 100%)' 
                        : 'linear-gradient(0deg, rgba(0,255,100,0.2) 0%, transparent 60%, rgba(255,0,0,0.3) 100%)';
                } else {
                    mainWrapper.classList.remove('wrapper-glitch');
                    mobileGlitchEl.style.opacity = '0';
                }

                if (bassPower > 0.85) {
                    lightningEl.style.opacity = (Math.random() > 0.3 ? (0.35 + (bassPower - 0.85) * 1.3) : 0).toString();
                } else {
                    lightningEl.style.opacity = '0';
                }

                ringBarMeshes.forEach((bar, idx) => {
                    const rnd = Math.sin(bassAngle * 3 + idx) * 0.5 + 0.5;
                    const scaleY = 0.25 + rnd * 1.25 * (bassPower + 0.2);
                    
                    const currentRadius = (baseRadius * bassScale) + 0.01;
                    const angle = (idx / ringBarsCount) * Math.PI * 2;
                    bar.position.set(Math.cos(angle) * currentRadius, Math.sin(angle) * currentRadius, 0);
                    bar.scale.set(1, scaleY, 1);
                    bar.material.opacity = 0.6 + rnd * 0.4;
                });

            } else {
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 10 * deltaTime);
                dirLight.intensity = 2.2;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(1)`;
                ambientGlowEl.style.opacity = '0.4';
                lightningEl.style.opacity = '0';
                mobileGlitchEl.style.opacity = '0';
                videoBoxEl.style.transform = `scale(1)`;
                mainWrapper.classList.remove('wrapper-glitch');
                badgeLiveEl.classList.remove('badge-bass-pulse');
                badgeListenerEl.classList.remove('badge-bass-pulse');
                themeSelectorEl.classList.remove('badge-bass-pulse');
                volumeBoxEl.classList.remove('badge-bass-pulse');

                if (tag1El && tag2El) {
                    tag1El.style.transform = `rotate(-22deg) scale(1)`;
                    tag2El.style.transform = `rotate(18deg) scale(1)`;
                    tag1El.style.opacity = '0.15'; tag2El.style.opacity = '0.15';
                }

                if (bgText1El && bgText2El) {
                    bgText1El.style.transform = `rotate(-12deg) scale(1)`;
                    bgText2El.style.transform = `rotate(10deg) scale(1)`;
                }

                ringBarMeshes.forEach((bar, idx) => {
                    const currentRadius = baseRadius + 0.01;
                    const angle = (idx / ringBarsCount) * Math.PI * 2;
                    bar.position.set(Math.cos(angle) * currentRadius, Math.sin(angle) * currentRadius, 0);
                    bar.scale.set(1, 0.25, 1); bar.material.opacity = 0.35;
                });
            }

            renderer.render(scene, camera);
        }
        
        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

        /* CYBER DUST PARTICLES */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        class CyberParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.9;
                this.speedY = (Math.random() - 0.5) * 0.9;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.pulseSpeed = Math.random() * 0.05 + 0.02;
            }
            update() {
                const speedMult = isPlayingState ? 2.5 : 1.0;
                this.x += this.speedX * speedMult;
                this.y += this.speedY * speedMult;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.03;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.85) this.opacity = 0.85;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = currentAccentColor;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < 70; i++) particlesArray.push(new CyberParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* FIREBASE LIVE LISTENERS */
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });
    </script>
